[tool.pytest.ini_options]
testpaths = ["tests", "exercises", "test_main.py"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "integration: requires a migrated PostgreSQL test database",
]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", ".venv-verify"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/exceptions.py" = ["B008"]
"portfolio_app/api.py" = ["B008"]

[tool.mypy]
python_version = "3.9"
files = ["app", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
