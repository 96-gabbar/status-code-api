name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: status_code_api_test
          POSTGRES_USER: status_code_api
          POSTGRES_PASSWORD: status_code_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U status_code_api -d status_code_api_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      portfolio-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio_service_test
          POSTGRES_USER: portfolio_api
          POSTGRES_PASSWORD: portfolio_api
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_api -d portfolio_service_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://status_code_api:status_code_api@127.0.0.1:5432/status_code_api_test
      TEST_DATABASE_URL: postgresql+psycopg://status_code_api:status_code_api@127.0.0.1:5432/status_code_api_test
      PORTFOLIO_DATABASE_URL: postgresql+psycopg://portfolio_api:portfolio_api@127.0.0.1:5433/portfolio_service_test
      TEST_PORTFOLIO_DATABASE_URL: postgresql+psycopg://portfolio_api:portfolio_api@127.0.0.1:5433/portfolio_service_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check production code
        run: mypy app portfolio_app scripts

      - name: Validate OpenAPI contracts
        run: |
          python scripts/validate_openapi.py
          python scripts/validate_portfolio_openapi.py

      - name: Verify both migration lifecycles
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic -c portfolio_alembic.ini upgrade head
          alembic -c portfolio_alembic.ini downgrade base
          alembic -c portfolio_alembic.ini upgrade head

      - name: Run all tests
        run: pytest tests tests_portfolio exercises test_main.py -q --junitxml=evidence/week3/ci-test-results.xml

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Start integrated stack
        run: docker compose up -d --build

      - name: Verify service states
        run: docker compose ps --all

      - name: Run cross-service tests
        env:
          RUN_E2E: "1"
        run: pytest tests_e2e -q --junitxml=evidence/week3/ci-e2e-results.xml

      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop integrated stack
        if: always()
        run: docker compose down --volumes
