name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: status_code_api_test
          POSTGRES_USER: status_code_api
          POSTGRES_PASSWORD: status_code_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U status_code_api -d status_code_api_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://status_code_api:status_code_api@127.0.0.1:5432/status_code_api_test
      TEST_DATABASE_URL: postgresql+psycopg://status_code_api:status_code_api@127.0.0.1:5432/status_code_api_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check production code
        run: mypy app scripts

      - name: Validate OpenAPI contract
        run: python scripts/validate_openapi.py

      - name: Verify migration lifecycle
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run all tests
        run: pytest -q --junitxml=evidence/week2/ci-test-results.xml
