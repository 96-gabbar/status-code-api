services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: status_code_api
      POSTGRES_USER: status_code_api
      POSTGRES_PASSWORD: status_code_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U status_code_api -d status_code_api"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &exception-environment
      STATUS_CODE_API_ENVIRONMENT: development
      STATUS_CODE_API_REPOSITORY_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://status_code_api:status_code_api@db:5432/status_code_api
      STATUS_CODE_API_LOG_LEVEL: INFO
      STATUS_CODE_API_PORTFOLIO_VALIDATION_ENABLED: "true"
      STATUS_CODE_API_PORTFOLIO_SERVICE_URL: http://portfolio-api:8001
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *exception-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      portfolio-api:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "scripts/check_container_health.py"]
      interval: 5s
      timeout: 3s
      retries: 12

  portfolio-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio_service
      POSTGRES_USER: portfolio_api
      POSTGRES_PASSWORD: portfolio_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_api -d portfolio_service"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55433:5432"

  portfolio-migrate:
    build: .
    command: ["alembic", "-c", "portfolio_alembic.ini", "upgrade", "head"]
    environment: &portfolio-environment
      PORTFOLIO_API_ENVIRONMENT: development
      PORTFOLIO_API_REPOSITORY_BACKEND: postgres
      PORTFOLIO_DATABASE_URL: postgresql+psycopg://portfolio_api:portfolio_api@portfolio-db:5432/portfolio_service
      PORTFOLIO_API_LOG_LEVEL: INFO
    depends_on:
      portfolio-db:
        condition: service_healthy
    restart: "no"

  portfolio-api:
    build: .
    command: ["uvicorn", "portfolio_app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: *portfolio-environment
    depends_on:
      portfolio-migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "scripts/check_portfolio_container_health.py"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  portfolio-postgres-data:
